description: "Bilingual: Balance the stability benefit of smoothing against smoothing bias to convert an exponential-Lipschitz perturbation bound into a polynomial Wasserstein rate. 中文：把平滑带来的稳定性收益和平滑偏差相平衡，将指数 Lipschitz 依赖转化为多项式 W2 速率。"
input:
  - perturbation bound for the smoothed problem
  - smoothing scale
  - bias bound between smoothed and original targets
  - Lipschitz-constrained function class
output:
  - combined Wasserstein error bound
  - optimized smoothing parameter
  - polynomial rate
assumptions:
  - true velocity lies in the constrained class
  - smoothing bias has an explicit W2 bound
  - schedule constraints match the stability theorem
core_steps:
  - Define the function class through the derived Lipschitz envelope.
  - Apply the perturbation theorem to the smoothed target.
  - Add smoothing bias using triangle inequality.
  - Express total error as stability-amplified approximation plus bias.
  - Optimize the boundary smoothing scale.
trigger_keywords:
