schema_version: 1
name: innovation-paper-finder
version: 0.1.0
scope: paper-to-skill
description: Find papers with possible new proof ideas, methods, assumptions, bounds, lower bounds, or cross-domain transfers.
entrypoint: SKILL.md
requires_env: {}
requires_tools:
  - agent-native-search
  - agent-native-read
requires_skills:
  - seed-paper-profiler
input_artifacts:
  - research_profile.json
  - optional_candidate_papers.json
  - optional_human_feedback_state.json
output_artifacts:
  - innovation_candidates.json
  - innovation_report.md
approval_required_for:
  - external_search_expansion
  - human_feedback_state_update
risk_level: low
