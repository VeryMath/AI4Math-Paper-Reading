    - Reuse must check that the L2 error is evaluated under the correct path distribution.
  conflict_resolutions:
    - issue: Direct discrepancy and Jacobian routes have different smoothness requirements.
      source_conditions: [First source uses a Lipschitz discrepancy estimate, Second source assumes continuously differentiable flows]
      decision: Use the independently derived integral route under explicit Lipschitz and flow-existence conditions.
      evidence: examples/auto_research_trial/flow_stability_validation.md sections 2-3
      status: resolved
