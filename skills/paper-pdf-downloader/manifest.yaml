schema_version: 1
name: paper-pdf-downloader
version: 0.1.0
scope: ai4math-paper-skills
description: Download confirmed open-access PDFs and preserve paper metadata without bypassing paywalls.
entrypoint: SKILL.md
requires_env:
  python: ">=3.10"
requires_tools:
  - python
  - network
requires_skills:
  - paper-triage-ranker
input_artifacts:
  - reading_plan.json
  - optional_candidate_papers.json
  - optional_innovation_candidates.json
  - optional_human_feedback_state.json
output_artifacts:
  - papers/<paper_id>/metadata.json
  - papers/<paper_id>/paper.pdf
  - download_report.md
approval_required_for:
  - pdf_download
  - network_access
  - paper_decision_update
risk_level: medium
